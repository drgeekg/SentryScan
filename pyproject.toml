[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentryscan"
version = "0.1.0"
description = "SentryScan: Autonomous Security Telemetry Analysis and Vulnerability Assessment Agent Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "R Ganesh", email = "116267896+drgeekg@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = ["agent", "security-simulation", "vulnerability-scanner", "telemetry", "langgraph", "bdi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
sentryscan = "sentryscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
